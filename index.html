<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shine — украшения для твоего стиля. Выбирайте кольца, серьги, браслеты и подвески, сохраняйте избранное и собирайте свой образ." />
    <meta name="theme-color" content="#181a1b" />
    <link rel="icon" type="image/png" href="/src/assets/shine-logo.png" />
    <link rel="preload" href="/src/assets/inter-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <style>html { background: #181a1b; } html[data-theme="light"] { background: #f7f8fb; }</style>
    <title>Shine — магазин</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
